name: Generate Cyberpunk Metrics

on:
  # 🕒 Run automatically every 12 hours
  schedule: [{cron: "0 */12 * * *"}]
  # 🚀 Allow manual execution from the Actions tab
  workflow_dispatch:
  # 💻 Run on every push to the main branch
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⚡ Compiling Threat Telemetry 
        uses: lowlighter/metrics@latest
        with:
          # Uses the built-in GitHub token (No setup required!)
          token: ${{ secrets.GITHUB_TOKEN }}
          user: lingeshkumar-ctrl
          
          # Force the Cyberpunk Terminal Aesthetic
          template: terminal
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          
          # Inject Language Analysis
          plugin_languages: yes
          plugin_languages_details: percentage
