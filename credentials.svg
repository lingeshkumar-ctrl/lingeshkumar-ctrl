<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=VT323&amp;display=swap');
      .title { font-family: 'DotGothic16', monospace; font-size: 26px; fill: #00d4ff; text-shadow: 0 0 5px rgba(0,212,255,0.5); letter-spacing: 2px; }
      .label { font-family: 'VT323', monospace; font-size: 19px; fill: #27c93f; }
      .value { font-family: 'VT323', monospace; font-size: 19px; fill: #e5e7eb; }
      .card { fill: rgba(10, 10, 10, 0.7); stroke: rgba(39, 201, 63, 0.3); stroke-width: 1.5; backdrop-filter: blur(15px); }
      .pic-border { stroke: #27c93f; stroke-width: 2; fill: none; }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090979" />
      <stop offset="100%" stop-color="#27c93f" />
    </linearGradient>
    <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="800" height="350" fill="#050505" rx="15" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05" />
  </pattern>
  <rect width="800" height="350" fill="url(#grid)" rx="15" />

  <!-- Liquid Blob (Animated, Glowing Green/Blue) -->
  <g transform="translate(400, 175)">
    <path fill="url(#grad1)" opacity="0.4" filter="url(#blur-filter)"
          d="M 120 -80 C 150 -30, 140 80, 100 110 C 60 140, -40 130, -80 90 C -120 50, -110 -50, -70 -90 C -30 -130, 90 -130, 120 -80 Z">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Premium Glassmorphism Card -->
  <rect x="20" y="20" width="760" height="310" rx="12" class="card" />
  
  <!-- Terminal Controls -->
  <circle cx="40" cy="40" r="6" fill="#ff5f56" />
  <circle cx="60" cy="40" r="6" fill="#ffbd2e" />
  <circle cx="80" cy="40" r="6" fill="#27c93f" />

  <!-- Title -->
  <text x="110" y="46" class="title">••• SYSTEM_CREDENTIALS •••</text>

  <!-- Profile Picture Outline (Hacker Style) -->
  <circle cx="100" cy="150" r="55" class="pic-border" stroke-dasharray="4" />
  <circle cx="100" cy="150" r="45" fill="#111" stroke="#00d4ff" stroke-width="2" />
  <path d="M 80 160 Q 100 120 120 160 Z" fill="#00d4ff" opacity="0.5" />
  <circle cx="100" cy="135" r="10" fill="#00d4ff" opacity="0.8" />
  
  <!-- Mini Identifiers -->
  <text x="100" y="235" font-family="VT323" font-size="16" fill="#00d4ff" text-anchor="middle">[ OP_ID: LINGESH ]</text>
  <text x="100" y="255" font-family="VT323" font-size="16" fill="#e5e7eb" text-anchor="middle">[ ROLE: SEC_ENG ]</text>
  <text x="100" y="275" font-family="VT323" font-size="16" fill="#ff5f56" text-anchor="middle">[ ACCESS: LEVEL_5 ]</text>

  <!-- Vertical Divider -->
  <line x1="180" y1="80" x2="180" y2="290" stroke="#333" stroke-width="1.5" stroke-dasharray="6" />

  <!-- Details -->
  <text x="210" y="110" class="label">&gt; STATUS.......</text>
  <text x="350" y="110" class="value">Graduated / Cybersecurity &amp; IoT Engineer</text>

  <text x="210" y="150" class="label">&gt; CLEARANCE....</text>
  <text x="350" y="150" class="value">Cybersecurity Intern @ Ashtaksha Labs</text>

  <text x="210" y="190" class="label">&gt; CORE_FOCUS...</text>
  <text x="350" y="190" class="value">Packet-level analysis to enterprise GRC platforms</text>

  <text x="210" y="230" class="label">&gt; EXECUTION....</text>
  <text x="350" y="230" class="value">High performance / Workflow automation</text>

  <text x="210" y="270" class="label">&gt; STACK........</text>
  <text x="350" y="270" class="value">Python, Go, Java, C, Rust</text>

</svg>
